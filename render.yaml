services:
  - type: web
    name: ftball-friends
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: LOBBY_TTL_MS
        value: "10800000"
      - key: SESSION_TTL_MS
        value: "43200000"
      - key: MAX_ACTIVE_LOBBIES
        value: "250"
      - key: MAX_LOBBY_MANAGERS
        value: "20"
